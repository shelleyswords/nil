# Netlify config for The NIL Game Plan.
# The website lives in the `site/` subfolder; this tells Netlify to publish it.
# No build step — it's plain static HTML/CSS/JS.
[build]
  publish = "site"
  command = ""

# Serverless function that handles email signups via Resend.
[functions]
  directory = "netlify/functions"

# Nice-to-have security/caching headers for the static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

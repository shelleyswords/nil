# Netlify config for The NIL Game Plan.
# The website lives in the `site/` subfolder; this tells Netlify to publish it.
# No build step — it's plain static HTML/CSS/JS.
[build]
  publish = "site"
  command = ""

# Serverless functions: email signup (Resend) + the scheduled drip sequence.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Run the drip daily at 14:00 UTC (~9–10am ET) — sends due emails 2–6.
[functions."drip"]
  schedule = "0 14 * * *"

# Nice-to-have security/caching headers for the static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images & videos don't change once published — cache them hard.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS / CSS / data / config change between deploys — always revalidate so
# updates show up immediately (no stale cached scripts).
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

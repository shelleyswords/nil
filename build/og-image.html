<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
  .card{width:1200px;height:630px;background:linear-gradient(150deg,#0b1f33 0%,#10324f 55%,#0a5e44 130%);
    color:#fff;padding:72px 80px;position:relative;display:flex;flex-direction:column;justify-content:center}
  .card::after{content:"";position:absolute;right:-140px;top:-140px;width:520px;height:520px;
    background:radial-gradient(circle,rgba(242,183,5,.22),transparent 70%)}
  .eyebrow{color:#f2b705;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:24px;margin-bottom:28px}
  h1{font-size:82px;font-weight:900;line-height:1.02;letter-spacing:-.02em;max-width:14ch}
  h1 .g{color:#f2b705}
  .rule{height:6px;width:160px;background:#f2b705;border-radius:3px;margin:34px 0}
  p{font-size:30px;color:#cdd9e4;max-width:24ch;line-height:1.35}
  .brand{margin-top:40px;font-size:28px;font-weight:900}
  .brand .g{color:#f2b705}
</style></head><body>
  <div class="card">
    <div class="eyebrow">For college athletes earning NIL money</div>
    <h1>Keep more of <span class="g">the money you earned.</span></h1>
    <div class="rule"></div>
    <p>Taxes, fees, and investing — in plain English.</p>
    <div class="brand">The NIL <span class="g">Game Plan</span></div>
  </div>
</body></html>
